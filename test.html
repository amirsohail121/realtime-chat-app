<!DOCTYPE html>
<html>

<head>
  <title>Socket Test</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>

<body>
  <h2 id="userLabel"></h2>
  <input id="chatIdInput" placeholder="Chat ID" value="6a3b9c0144613bd3e2f9aee3" />
  <button onclick="joinChat()">Join Chat</button>
  <br><br>
  <input id="messageInput" placeholder="Type a message" />
  <button onclick="sendMsg()">Send</button>
  <br><br>
  <div id="messages"></div>

  <script>
    const socket = io("http://localhost:5000");
    document.getElementById("userLabel").innerText = "Connecting...";

    socket.on("connect", () => {
      document.getElementById("userLabel").innerText = "Connected: " + socket.id;
    });

    function joinChat() {
      const chatId = document.getElementById("chatIdInput").value;
      socket.emit("join_chat", chatId);
    }

    function sendMsg() {
      const chatId = document.getElementById("chatIdInput").value;
      const content = document.getElementById("messageInput").value;
      socket.emit("send_message", { chatId, content });
    }

    socket.on("receive_message", (data) => {
      const div = document.getElementById("messages");
      div.innerHTML += `<p><b>Received:</b> ${data.content}</p>`;
    });
  </script>
</body>

</html>
